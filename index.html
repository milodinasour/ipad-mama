<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1d24">
<title>iPad Mama</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-shaped stage; 3D living room fills it, HUD floats top, call button anchors bottom. Single evening-lamp look in every theme. */
:root {
  --night: #2a1d24;      /* page ground outside the stage */
  --cocoa: #3e2a2c;      /* text on light panels */
  --biscuit: #fff3e3;    /* panels */
  --biscuit-2: #f7e2c8;  /* panel insets */
  --tangerine: #ef8a55;  /* call button, primary */
  --tangerine-deep: #c9663a;
  --sage: #7fa486;
  --honey: #f4c35e;      /* jackpot, streak */
  --win: #4f9a62;
  --lose: #d0574d;
  --rose: #e9a0a0;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #4a3036 0%, var(--night) 70%);
  color: var(--cocoa);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
#app {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto;
  overflow: hidden; background: #3b2a2a;
}
@media (min-width: 520px) { #app { border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.45); height: min(100%, 920px); top: 50%; transform: translateY(-50%); } }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#vignette {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(190, 30, 60, .55) 100%);
  transition: opacity .8s ease;
}
#app.climax #vignette { opacity: 1; animation: beat .62s infinite; }
@keyframes beat { 0%,100% { filter: brightness(1); } 12% { filter: brightness(1.6); } 30% { filter: brightness(1.15); } 40% { filter: brightness(1.5); } }

/* HUD */
.hud {
  position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
  display: grid; gap: 10px; transition: opacity .4s;
}
.hud-row { display: flex; align-items: stretch; gap: 8px; }
.stat {
  background: color-mix(in srgb, var(--biscuit) 92%, transparent);
  border-radius: 16px; padding: 6px 12px 4px; display: grid; line-height: 1;
  box-shadow: 0 4px 0 rgba(62,42,44,.18);
}
.stat small { font: 800 10px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.stat b { font: 800 26px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.stat.score { flex: 1; }
.stat.score b.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.pips { display: flex; gap: 5px; align-items: center; height: 31px; }
.pip { width: 15px; height: 15px; border-radius: 50%; background: var(--biscuit-2); box-shadow: inset 0 2px 0 rgba(62,42,44,.15); transition: background .3s, transform .3s; }
.pip.on { background: var(--honey); transform: scale(1.1); box-shadow: 0 0 10px var(--honey); }
.iconbtn {
  pointer-events: auto; border: 0; cursor: pointer; width: 44px; border-radius: 16px;
  background: color-mix(in srgb, var(--biscuit) 92%, transparent); color: var(--cocoa);
  box-shadow: 0 4px 0 rgba(62,42,44,.18); display: grid; place-items: center;
}
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }

.scen {
  justify-self: center; display: flex; align-items: center; gap: 10px;
  background: var(--biscuit); border-radius: 999px; padding: 6px 14px 6px 8px;
  box-shadow: 0 4px 0 rgba(62,42,44,.18); transition: background .4s, color .4s;
}
.scen .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--biscuit-2); }
.scen .ic svg { width: 22px; height: 22px; }
.scen .name { font: 800 17px/1 var(--display); }
.scen .odds { font: 800 12px/1.2 var(--body); font-variant-numeric: tabular-nums; display: grid; text-align: right; }
.scen .odds .w { color: var(--win); } .scen .odds .l { color: var(--lose); }
.scen .pct { font: 800 20px/1 var(--display); padding-left: 10px; border-left: 2px dashed rgba(62,42,44,.2); font-variant-numeric: tabular-nums; }
.scen.swap { animation: swap .5s; }
@keyframes swap { 0% { transform: scale(.85) rotate(-3deg); } 60% { transform: scale(1.06); } }
#app.climax .scen { background: #ffd9d9; }
#app.climax .scen .ic { background: var(--lose); color: #fff; animation: beat .62s infinite; }

.mood { justify-self: center; display: flex; align-items: center; gap: 6px; }
.mood svg { width: 18px; height: 18px; color: var(--biscuit); opacity: .9; }
.moodbar { width: 120px; height: 8px; border-radius: 8px; background: rgba(255,243,227,.35); overflow: hidden; }
.moodbar i { display: block; height: 100%; width: 0%; background: var(--sage); border-radius: 8px; transition: width .3s, background .3s; }

/* bottom */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; justify-items: center; gap: 6px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; transition: opacity .4s;
}
#callBtn {
  pointer-events: auto; border: 0; cursor: pointer; touch-action: manipulation;
  font: 800 24px/1 var(--display); color: #fff; letter-spacing: .01em;
  background: var(--tangerine); border-radius: 999px; padding: 16px 34px 12px;
  box-shadow: 0 6px 0 var(--tangerine-deep), 0 12px 24px rgba(0,0,0,.25);
  display: flex; align-items: center; gap: 12px; transition: transform .1s, filter .2s, box-shadow .1s;
}
#callBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tangerine-deep), 0 6px 14px rgba(0,0,0,.25); }
#callBtn[disabled] { filter: saturate(.3) brightness(.9); cursor: default; }
#callBtn .left { font: 800 14px/1 var(--body); background: rgba(255,255,255,.25); border-radius: 999px; padding: 6px 9px 5px; font-variant-numeric: tabular-nums; }
.hint { font: 700 12px/1 var(--body); color: var(--biscuit); opacity: .75; transition: opacity .6s; }

/* speech bubbles, floaters */
#overlay3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bubble {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
  background: #fff; color: var(--cocoa); font: 800 17px/1.1 var(--display);
  padding: 8px 13px 5px; border-radius: 16px; white-space: nowrap;
  box-shadow: 0 4px 0 rgba(62,42,44,.18); opacity: 0; transition: opacity .2s;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
.bubble.show { opacity: 1; animation: pop .35s; }
@keyframes pop { 0% { scale: .6; } 70% { scale: 1.08; } }
.bubble.kid { background: #d7f0ee; } .bubble.kid::after { border-top-color: #d7f0ee; }
.bubble.angry { background: var(--lose); color: #fff; } .bubble.angry::after { border-top-color: var(--lose); }
.bubble.faint { background: rgba(255,255,255,.6); color: rgba(62,42,44,.6); }
.bubble.faint::after { border-top-color: rgba(255,255,255,.6); }
.floater { position: absolute; transform: translate(-50%, -50%); font: 800 30px/1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.2); animation: floatUp 1.6s ease-out forwards; font-variant-numeric: tabular-nums; }
.floater.w { color: #c9f5c9; } .floater.l { color: #ffc2bb; }
@keyframes floatUp { 0% { opacity: 0; translate: 0 10px; scale: .7; } 15% { opacity: 1; scale: 1.15; } 100% { opacity: 0; translate: 0 -70px; scale: 1; } }

/* jackpot */
#jackpot { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; }
#jackpot.go { animation: jp 2.6s ease forwards; }
@keyframes jp { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
#jackpot .card { text-align: center; color: var(--honey); text-shadow: 0 4px 0 #8a5a1c, 0 0 30px rgba(244,195,94,.8); }
#jackpot .card b { display: block; font: 800 58px/0.9 var(--display); letter-spacing: .02em; }
#jackpot .card span { font: 800 30px/1 var(--display); color: #fff; }
#jackpot.go .card { animation: jpcard 2.6s ease; }
@keyframes jpcard { 0% { transform: scale(.3) rotate(-10deg); } 15% { transform: scale(1.15) rotate(3deg); } 25% { transform: scale(1); } }
.confetti { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

/* screens */
.screen {
  position: absolute; inset: 0; display: grid; align-content: center; justify-items: center;
  padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(42,29,36,.15), rgba(42,29,36,.65));
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  overflow-y: auto;
}
.panel {
  width: 100%; max-width: 360px; background: var(--biscuit); border-radius: 28px; padding: 22px 20px 20px;
  box-shadow: 0 8px 0 rgba(62,42,44,.25), 0 30px 60px rgba(0,0,0,.35); display: grid; gap: 14px;
}
.logo { text-align: center; line-height: .85; }
.logo h1 { margin: 0; font: 800 54px/0.9 var(--display); color: var(--tangerine); text-shadow: 0 4px 0 var(--tangerine-deep); letter-spacing: -.01em; text-wrap: balance; }
.logo p { margin: 10px 0 0; font: 700 14px/1.3 var(--body); opacity: .7; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lg { background: var(--biscuit-2); border-radius: 14px; padding: 7px 9px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.lg svg { width: 22px; height: 22px; flex: none; }
.lg div { display: grid; line-height: 1.1; min-width: 0; }
.lg b { font: 800 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.lg small { font: 800 11px/1.2 var(--body); font-variant-numeric: tabular-nums; }
.lg small .w { color: var(--win); } .lg small .l { color: var(--lose); }
.jprule { display: flex; align-items: center; justify-content: center; gap: 8px; font: 800 13px/1 var(--body); }
.jprule .pips .pip { background: var(--honey); width: 12px; height: 12px; }
label.f { display: grid; gap: 6px; font: 800 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
input#nameInput {
  font: 800 20px/1 var(--display); color: var(--cocoa); border: 3px solid var(--biscuit-2); background: #fff;
  border-radius: 16px; padding: 12px 14px 8px; width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text;
}
input#nameInput.err { border-color: var(--lose); animation: shake .35s; }
@keyframes shake { 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
.btn { border: 0; cursor: pointer; font: 800 22px/1 var(--display); border-radius: 999px; padding: 14px 20px 10px; touch-action: manipulation; }
.btn.primary { background: var(--tangerine); color: #fff; box-shadow: 0 5px 0 var(--tangerine-deep); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--tangerine-deep); }
.btn.ghost { background: transparent; color: var(--cocoa); font-size: 16px; padding: 8px; text-decoration: underline; text-underline-offset: 4px; }
.final { text-align: center; display: grid; gap: 2px; }
.final small { font: 800 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.final b { font: 800 64px/1 var(--display); color: var(--tangerine); font-variant-numeric: tabular-nums; }
.final .jp { font: 800 15px/1.2 var(--body); color: #a46d14; }
.final .note { font: 700 12px/1.3 var(--body); opacity: .65; }
.board h2 { margin: 0 0 6px; font: 800 22px/1 var(--display); display: flex; justify-content: space-between; align-items: baseline; }
.board h2 span { font: 800 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
.board ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 300px; overflow-y: auto; }
.board li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--biscuit-2); border-radius: 12px; padding: 7px 10px 5px; }
.board li.me { background: #ffe0b8; box-shadow: inset 0 0 0 2px var(--tangerine); }
.board .rk { font: 800 15px/1 var(--display); opacity: .55; font-variant-numeric: tabular-nums; }
.board li:nth-child(1) .rk { color: #b07d10; opacity: 1; }
.board .nm { font: 800 16px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .jb { font: 800 11px/1 var(--body); background: var(--honey); color: #5c3b06; border-radius: 999px; padding: 4px 7px 3px; white-space: nowrap; }
.board .sc { font: 800 18px/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; min-width: 44px; }
.board li.empty { display: block; font: 700 14px/1.4 var(--body); opacity: .65; text-align: center; padding: 14px 6px; background: var(--biscuit-2); border-radius: 12px; }
.row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
#app.playing .hud, #app.playing .dock { opacity: 1; }
#app:not(.playing) .hud, #app:not(.playing) .dock { opacity: 0; pointer-events: none; }
#app:not(.playing) #callBtn { pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>

<div id="app">
  <canvas id="scene" aria-label="Living room where Mama watches her iPad"></canvas>
  <div id="vignette"></div>
  <div id="overlay3d">
    <div class="bubble" id="mamaBubble"></div>
    <div class="bubble kid" id="kidBubble"></div>
  </div>

  <div class="hud">
    <div class="hud-row">
      <div class="stat score"><small>Score</small><b id="scoreVal">0</b></div>
      <div class="stat"><small>Jackpot</small><div class="pips" id="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div>
      <button class="iconbtn" id="muteBtn" aria-label="Mute sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="muteIcon"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    </div>
    <div class="scen" id="scenChip">
      <span class="ic" id="scenIcon"></span>
      <span class="name" id="scenName">iPad</span>
      <span class="odds"><span class="w" id="scenWin">+20</span><span class="l" id="scenLose">−10</span></span>
      <span class="pct" id="scenPct">60%</span>
    </div>
    <div class="mood" title="Mama's patience">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9z"/></svg>
      <div class="moodbar"><i id="moodFill"></i></div>
    </div>
  </div>

  <div class="dock">
    <button id="callBtn"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Call Mama <span class="left" id="callsLeft">30</span></button>
    <div class="hint" id="hint">Tap the floor to walk around</div>
  </div>

  <div id="jackpot"><div class="card"><b>JACKPOT</b><span id="jpAmt">+300</span></div></div>

  <section class="screen" id="startScreen">
    <div class="panel">
      <div class="logo"><h1>iPad Mama</h1><p>She's deep in her drama. Call her anyway.</p></div>
      <div class="legend" id="legend"></div>
      <div class="jprule"><span class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></span> 4 replies in a row = Jackpot</div>
      <label class="f" for="nameInput">Your name
        <input id="nameInput" maxlength="14" autocomplete="nickname" placeholder="e.g. Little Mei">
      </label>
      <button class="btn primary" id="startBtn">Start · 30 calls</button>
      <button class="btn ghost" id="boardBtn">Leaderboard</button>
    </div>
  </section>

  <section class="screen" id="endScreen" hidden>
    <div class="panel">
      <div class="final">
        <small>Final score</small>
        <b id="finalScore">0</b>
        <span class="jp" id="finalJp"></span>
        <span class="note" id="saveNote"></span>
      </div>
      <div class="board"><h2>Top players <span class="mode"></span></h2><ol class="list"></ol></div>
      <button class="btn primary" id="againBtn">Play again</button>
    </div>
  </section>

  <section class="screen" id="boardScreen" hidden>
    <div class="panel">
      <div class="board"><h2>Top players <span class="mode"></span></h2><ol class="list"></ol></div>
      <button class="btn primary" id="closeBoard">Back</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

/* ---------------- game rules ---------------- */
const TOTAL_CALLS = 30, JACKPOT = 300, STREAK_FOR_JP = 4;
const SCEN = {
  boring: { name: "Boring…",      p: .80, win: 10,  lose: 5,  weight: 25, dur: [7, 10] },
  ipad:   { name: "iPad",         p: .60, win: 20,  lose: 10, weight: 35, dur: [6, 9] },
  duo:    { name: "iPad + Phone", p: .40, win: 45,  lose: 20, weight: 25, dur: [6, 9] },
  climax: { name: "Climax!",      p: .25, win: 100, lose: 30, weight: 15, dur: [5, 7] },
};
const ICONS = {
  ipad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="18" r=".9" fill="currentColor"/></svg>',
  duo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2.5" y="4" width="13" height="16" rx="2"/><rect x="15.5" y="9" width="6.5" height="11" rx="1.5" fill="currentColor" fill-opacity=".25"/></svg>',
  climax: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.3-9.2C1.4 8.4 3.6 4.5 7.3 4.5c2 0 3.5 1.1 4.7 2.7 1.2-1.6 2.7-2.7 4.7-2.7 3.7 0 5.9 3.9 4.6 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  boring: '<svg viewBox="0 0 24 24" fill="currentColor"><text x="3" y="20" font-family="Baloo 2, sans-serif" font-weight="800" font-size="13">z</text><text x="11" y="13" font-family="Baloo 2, sans-serif" font-weight="800" font-size="10">z</text><text x="17" y="7" font-family="Baloo 2, sans-serif" font-weight="800" font-size="7">z</text></svg>',
};
const LINES = {
  kid: ["Mama!", "Mama~", "Mamaaa!", "MAMA!!"],
  lookResp: ["Yes, dear?", "What is it?", "Hmm? Tell me.", "Yes sayang?"],
  noLookResp: ["Yes?", "What?", "Say again?", "Hmm?", "Wait ah…", "Ok ok…", "Later ya…"],
  angry: ["Stop calling!", "Aiyo! Not now!", "Mama is BUSY!", "Don't disturb!"],
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const fmt = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const app = $("app"), canvas = $("scene");
const ui = {
  score: $("scoreVal"), pips: [...$("pips").children], calls: $("callsLeft"), call: $("callBtn"),
  chip: $("scenChip"), sIcon: $("scenIcon"), sName: $("scenName"), sWin: $("scenWin"), sLose: $("scenLose"), sPct: $("scenPct"),
  mood: $("moodFill"), hint: $("hint"), mamaB: $("mamaBubble"), kidB: $("kidBubble"), overlay: $("overlay3d"),
};
$("legend").innerHTML = Object.entries(SCEN).map(([k, s]) =>
  `<div class="lg">${ICONS[k]}<div><b>${Math.round(s.p * 100)}%</b><small><span class="w">+${s.win}</span> / <span class="l">−${s.lose}</span></small></div></div>`).join("");

/* ---------------- three.js scene ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();

const parts = [];
function emit(tex, pos, { vel = [0, .5, 0], spread = .1, life = 1.4, size = .2, color = "#ffffff", grow = 0 } = {}) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color, transparent: true, depthWrite: false }));
  s.position.copy(pos).add(new THREE.Vector3(rand(-spread, spread), rand(-spread, spread), rand(-spread, spread)));
  s.scale.setScalar(size); scene.add(s);
  parts.push({ s, v: new THREE.Vector3(vel[0] + rand(-.15, .15), vel[1], vel[2] + rand(-.1, .1)), life, max: life, size, grow });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { scene.remove(p.s); p.s.material.dispose(); parts.splice(i, 1); continue; }
    p.s.position.addScaledVector(p.v, dt);
    p.s.material.opacity = Math.min(1, p.life / p.max * 1.6);
    p.s.scale.setScalar(p.size * (1 + (1 - p.life / p.max) * p.grow));
  }
}

/* ---------------- audio ---------------- */
const Snd = { ctx: null, muted: false };
try { Snd.muted = localStorage.getItem("ipadmama-muted") === "1"; } catch (e) {}
function audioInit() {
  if (Snd.ctx) { Snd.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = Snd.ctx = new AC();
  Snd.master = ctx.createGain(); Snd.master.gain.value = Snd.muted ? 0 : .9; Snd.master.connect(ctx.destination);
  Snd.musicLP = ctx.createBiquadFilter(); Snd.musicLP.type = "lowpass"; Snd.musicLP.frequency.value = 2400;
  Snd.music = ctx.createGain(); Snd.music.gain.value = .3; Snd.music.connect(Snd.musicLP); Snd.musicLP.connect(Snd.master);
  Snd.sfx = ctx.createGain(); Snd.sfx.gain.value = .75; Snd.sfx.connect(Snd.master);
  // vinyl crackle bed
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * .3 + (Math.random() < .0008 ? (Math.random() - .5) * 4 : 0);
  const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const nf = ctx.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 1800;
  const ng = ctx.createGain(); ng.gain.value = .035; ns.connect(nf); nf.connect(ng); ng.connect(Snd.music); ns.start();
  Snd.noise = nb;
  Snd.next = ctx.currentTime + .1; Snd.beat = 0; Snd.hbNext = 0;
  setInterval(schedule, 90);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    b.querySelector(".mode").textContent = LB.rows ? "Global" : LB.mode;
    const ol = b.querySelector(".list"); ol.textContent = ""; marked = false;
    if (!rows.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "No scores yet. Be the first to call Mama!"; ol.appendChild(li); return; }
    rows.forEach((r, i) => {
      const li = document.createElement("li");
      if (!marked && mine && r.name === mine.name && r.score === mine.score) { li.classList.add("me"); marked = true; }
      const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = i + 1;
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = String(r.name).slice(0, 14) || "Player";
      const jb = document.createElement("span"); const jn = Math.max(0, Math.floor(Number(r.jackpots) || 0));
      if (jn) { jb.className = "jb"; jb.textContent = "★ Jackpot" + (jn > 1 ? " ×" + jn : ""); }
      const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = Math.round(r.score);
      li.append(rk, nm, jb, sc); ol.appendChild(li);
    });
  });
}
async function api(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, opts, {
    headers: Object.assign({ apikey: SUPABASE_KEY, "Content-Type": "application/json" }, opts.headers),
  }));
  if (!res.ok) throw new Error("Supabase " + res.status);
  return res.status === 204 || res.status === 201 ? null : res.json();
}
async function loadBoard() {
  try { LB.rows = await api(TABLE + "?select=name,score,jackpots&order=score.desc,created_at.asc&limit=20"); }
  catch (e) { LB.rows = null; }
  renderBoards();
}
renderBoards();
loadBoard();
async function submitScore() {
  const row = { name: state.name.slice(0, 14), score: state.score, jackpots: state.jackpots, at: Date.now() };
  saveLocal(row); LB.last = row;
  const note = $("saveNote");
  note.textContent = "Saving to the global board…"; renderBoards();
  try {
    await api(TABLE, { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ name: row.name, score: row.score, jackpots: row.jackpots }) });
    note.textContent = "Saved to the global board!";
    await loadBoard();
  } catch (e) { note.textContent = "Couldn't reach the global board. Saved on this device."; renderBoards(); }
}

/* ---------------- screens ---------------- */
const nameInput = $("nameInput");
try { nameInput.value = localStorage.getItem("ipadmama-name") || ""; } catch (e) {}
function startGame() {
  const n = nameInput.value.trim();
  if (!n) { nameInput.classList.remove("err"); void nameInput.offsetWidth; nameInput.classList.add("err"); nameInput.focus(); return; }
  try { localStorage.setItem("ipadmama-name", n); } catch (e) {}
  audioInit(); setMuted(Snd.muted);
  Object.assign(state, { playing: true, busy: false, name: n, score: 0, calls: TOTAL_CALLS, streak: 0, jackpots: 0, annoy: 0 });
  renderHud(); ui.call.disabled = false; ui.hint.style.opacity = .75;
  $("startScreen").hidden = true; $("endScreen").hidden = true; $("boardScreen").hidden = true;
  app.classList.add("playing");
  setScen("ipad");
}
function endGame() {
  state.playing = false; app.classList.remove("playing");
  $("finalScore").textContent = state.score;
  $("finalJp").textContent = state.jackpots ? `★ Hit the jackpot${state.jackpots > 1 ? " ×" + state.jackpots : ""}!` : "No jackpot this time";
  $("endScreen").hidden = false;
  submitScore();
}
$("startBtn").addEventListener("click", startGame);
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
$("againBtn").addEventListener("click", () => { $("endScreen").hidden = true; $("startScreen").hidden = false; });
$("boardBtn").addEventListener("click", () => { loadBoard(); $("startScreen").hidden = true; $("boardScreen").hidden = false; });
$("closeBoard").addEventListener("click", () => { $("boardScreen").hidden = true; $("startScreen").hidden = false; });
document.addEventListener("keydown", e => { if (e.code === "Space" && state.playing && document.activeElement !== nameInput) { e.preventDefault(); callMama(); } });
})();
</script>
